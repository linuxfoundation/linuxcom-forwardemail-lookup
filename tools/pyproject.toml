# CI-only tooling, not part of the Worker. Locked in uv.lock (hash-verified)
# and updated by Dependabot's `uv` ecosystem with a cooldown.
[project]
name = "linuxcom-lookup-ci-tools"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "zizmor==1.32.0",
]

[tool.uv]
package = false

[tool.uv.pip]
require-hashes = true
verify-hashes = true
