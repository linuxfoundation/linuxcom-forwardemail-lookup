name: CI

on:
  pull_request:
  workflow_call:

# Least-privilege baseline; no job needs more.
permissions:
  contents: read

# Cancel superseded PR runs. Runs called from Deploy are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Keep this name: it is the required status check (`test`) on main.
    name: test
    runs-on: ubuntu-24.04
    steps:
      # Audit mode while the egress allowlist is confirmed; tighten to
      # `block` with allowed-endpoints afterwards. (Runtime monitoring needs
      # a StepSecurity plan on private repos; free once the repo is public.)
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Hash-verified install from package-lock.json; --ignore-scripts keeps
      # dependency lifecycle scripts from running on the runner.
      - run: npm ci --ignore-scripts

      # Tampered `resolved` URLs pass integrity checks and npm ci; lint them.
      - run: npm run lint:lockfile

      # Registry signatures + provenance attestations for the whole tree.
      - run: npm audit signatures
      - run: npm audit --audit-level=moderate

      - run: npm run typecheck
      - run: npm test

      - name: Validate Worker bundle
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy --dry-run --outdir dist

  zizmor:
    name: GitHub Actions security (zizmor)
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false

      # zizmor comes from tools/uv.lock (hash-verified, Dependabot-managed).
      - run: uv sync --frozen --project tools
      - run: uv run --frozen --project tools zizmor --persona=auditor --min-severity=low .

  dependency-review:
    name: Dependency review
    # PR-only: blocks new dependencies with known vulnerabilities or
    # copyleft licenses. Results go to the job summary (no PR comment, so no
    # pull-requests: write is needed).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          # Allowlist, not a denylist: a deny list misses prohibited licenses
          # inside compound expressions (e.g. "MIT AND GPL-3.0-only"), while
          # an allowlist rejects anything not listed here.
          allow-licenses: >-
            MIT, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD,
            OFL-1.1, CC0-1.0, Python-2.0
          # Reviewed exceptions: dev/build-only weak-copyleft packages that
          # are never bundled into the Worker. sharp's libvips binaries
          # (LGPL-3.0-or-later; via wrangler > miniflare > sharp) and
          # lightningcss (MPL-2.0). Any other LGPL/MPL/GPL package still fails.
          allow-dependencies-licenses: >-
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-wasm32,
            pkg:npm/%40img/sharp-win32-arm64,
            pkg:npm/%40img/sharp-win32-ia32,
            pkg:npm/%40img/sharp-win32-x64,
            pkg:npm/lightningcss,
            pkg:npm/lightningcss-android-arm64,
            pkg:npm/lightningcss-darwin-arm64,
            pkg:npm/lightningcss-darwin-x64,
            pkg:npm/lightningcss-freebsd-x64,
            pkg:npm/lightningcss-linux-arm-gnueabihf,
            pkg:npm/lightningcss-linux-arm64-gnu,
            pkg:npm/lightningcss-linux-arm64-musl,
            pkg:npm/lightningcss-linux-x64-gnu,
            pkg:npm/lightningcss-linux-x64-musl,
            pkg:npm/lightningcss-win32-arm64-msvc,
            pkg:npm/lightningcss-win32-x64-msvc
