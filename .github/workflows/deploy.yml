name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      WORKER_HOSTNAME: ${{ secrets.WORKER_HOSTNAME }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
      GOOGLE_ADMIN_SUBJECT: ${{ secrets.GOOGLE_ADMIN_SUBJECT }}
      FORWARDEMAIL_API_TOKEN: ${{ secrets.FORWARDEMAIL_API_TOKEN }}
      GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON }}
    steps:
      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID WORKER_HOSTNAME \
                      ACCESS_TEAM_DOMAIN ACCESS_AUD GOOGLE_ADMIN_SUBJECT \
                      FORWARDEMAIL_API_TOKEN GOOGLE_SA_KEY_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret $name is not set"
              missing=1
            fi
          done
          if ! printf '%s' "$WORKER_HOSTNAME" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$'; then
            echo "::error::WORKER_HOSTNAME must be a bare hostname (no scheme or path)"
            missing=1
          fi
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Uploaded with `wrangler secret bulk` before the deploy, so the
          # GitHub secrets are the source of truth for all runtime config.
          secrets: |
            ACCESS_TEAM_DOMAIN
            ACCESS_AUD
            GOOGLE_ADMIN_SUBJECT
            FORWARDEMAIL_API_TOKEN
            GOOGLE_SA_KEY_JSON
          command: deploy --domain ${{ secrets.WORKER_HOSTNAME }}
